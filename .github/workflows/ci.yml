# Build, test and package on every push to main and every pull request (and by hand). Ubuntu 24.04:
# a package built there installs on 24.04 and later.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token stays out of .git/config, where any build script could read it.
          persist-credentials: false

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deb
            target
          key: cargo-${{ runner.os }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Test without the capture feature
        run: cargo test --no-default-features --locked

      - name: Clippy
        run: cargo clippy --release --locked

      - name: Package
        run: |
          command -v cargo-deb >/dev/null || cargo install cargo-deb --locked --version 3.8.0
          cargo deb --no-build --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sill-linux-deb
          path: target/debian/*.deb
          retention-days: 14

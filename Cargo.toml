[package]
name = "sill-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Linux (Wayland) host for the Sill iPhone and iPad app (unofficial)"
repository = "https://github.com/afds/sill-linux"
readme = "README.md"
# Let chains (2024 edition) and u32::is_multiple_of.
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"], optional = true }
futures-util = { version = "0.3.34", optional = true }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
libc = "0.2.191"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
uuid = { version = "1.28.0", features = ["v4"] }

[features]
default = ["capture"]
# The portal and GStreamer pipeline. Needs libgstreamer1.0-dev and libgstreamer-plugins-base1.0-dev;
# without it (--no-default-features) the protocol and server still build and test.
capture = ["dep:ashpd", "dep:futures-util", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
futures-util = ["dep:futures-util"]

# `cargo deb` (cargo-deb): the Ubuntu package. Runtime: GStreamer's PipeWire source, GL upload,
# the HEVC encoders and h265parse (plugins-bad: nvh265enc, vah265enc, x265enc), and Avahi's
# avahi-publish for discovery; the GStreamer libraries themselves come from $auto.
[package.metadata.deb]
maintainer = "Deniss Afonin <deniss.afonin@gmail.com>"
copyright = "2026 Deniss Afonin"
license-file = ["LICENSE", "0"]
section = "video"
priority = "optional"
depends = "$auto, gstreamer1.0-pipewire, gstreamer1.0-plugins-base, gstreamer1.0-plugins-bad, gstreamer1.0-gl, avahi-utils"
suggests = "qrencode"
extended-description = "Streams this Linux desktop, or a single window or monitor, to the Sill app on an iPhone or iPad, which takes the input back: taps, the trackpad, keys and the clipboard. Pairing by code, TLS 1.3 with pinned keys. GNOME on Wayland gets the most (single windows need the extension it installs); other Wayland desktops stream the whole desktop through the portal. Unofficial: not made or supported by Sill's author."
assets = [
    ["target/release/sill-linux", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sill-linux/README.md", "644"],
    ["NOTICE", "usr/share/doc/sill-linux/NOTICE", "644"],
]


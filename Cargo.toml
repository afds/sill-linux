[package]
name = "sill-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Linux (Wayland) host for the Sill iPhone and iPad app (unofficial, separate project)"
publish = false

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"], optional = true }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
libc = "0.2.191"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
uuid = { version = "1.28.0", features = ["v4"] }

[features]
default = ["capture"]
# The portal and GStreamer pipeline. Needs libgstreamer1.0-dev and libgstreamer-plugins-base1.0-dev;
# without it (--no-default-features) the protocol and server still build and test.
capture = ["dep:ashpd", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
